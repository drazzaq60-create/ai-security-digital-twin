# Render Blueprint for the backend (alternative to the Dockerfile / Hugging Face Spaces).
# Connect the GitHub repo in Render; it reads this file. Set GEMINI_API_KEY in the dashboard.
services:
  - type: web
    name: sentinel-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # set this secret in the Render dashboard, never in the repo
      - key: PYTHON_VERSION
        value: "3.11.9"
